name: Release

# Run manually from the Actions tab with the version to build, e.g. 1.0.1.
# Release files can also be built locally with eng/Publish.ps1.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the v prefix)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Fetch archive engine
        shell: pwsh
        run: ./eng/Get-SevenZip.ps1

      - name: Test
        run: dotnet test --project tests/PackWise.Tests -c Release

      - name: Publish
        shell: pwsh
        run: ./eng/Publish.ps1 -Version '${{ inputs.version }}' -SkipTests

      # Code signing: when a signing service (for example SignPath Foundation) is set up,
      # sign artifacts/release/**/PackWise.exe here, before the zip is created.

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          name: PackWise ${{ inputs.version }}
          files: |
            artifacts/release/*.exe
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
